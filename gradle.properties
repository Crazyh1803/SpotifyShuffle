org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# R8 full mode — stronger optimisation (class merging, argument/return-value propagation,
# more aggressive inlining) than compatibility mode. This is already the default on AGP 8.x;
# stated explicitly so the setting is visible and survives any future default change.
# Google Play's "Improve your app's memory and performance with R8 optimization" tip reads
# the r8-mode marker embedded in the shipped DEX, which this controls.
android.enableR8.fullMode=true
